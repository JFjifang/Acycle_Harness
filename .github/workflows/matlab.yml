name: MATLAB Acycle validation
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.token || format('MATLAB validation {0}', github.sha) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      token:
        description: Unique request identifier (or validation)
        type: string
        default: validation
      request:
        description: Base64 encoded JSON request, empty for validation
        type: string
        default: ''

permissions:
  contents: read

jobs:
  matlab:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ACYCLE_REQUEST: ${{ inputs.request }}
      ACYCLE_TOKEN: ${{ inputs.token || 'validation' }}
      ACYCLE_UPSTREAM_REVISION: dcba4279168745b563e0535b954297023dd62fc7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mingsongli/acycle
          ref: dcba4279168745b563e0535b954297023dd62fc7
          path: upstream/acycle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python orchestration
        run: python -m pip install -e . pytest
      - name: Python contract tests
        if: env.ACYCLE_REQUEST == ''
        run: python -m pytest -q
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox Curve_Fitting_Toolbox
      - name: Prepare remote request
        if: env.ACYCLE_REQUEST != ''
        run: python scripts/ci_request.py
      - name: Execute MATLAB request
        if: env.ACYCLE_REQUEST != ''
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); acycle_batch('ci-request.json', 'ci-output/response.json');
      - name: MATLAB numerical and example validation
        if: env.ACYCLE_REQUEST == ''
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); run_validation(fullfile(pwd,'upstream','acycle'), fullfile(pwd,'validation','matlab'));
      - name: Upload MATLAB outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acycle-output-${{ env.ACYCLE_TOKEN }}
          path: |
            ci-output/
            validation/matlab/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload compact validation report
        if: always() && env.ACYCLE_REQUEST == ''
        uses: actions/upload-artifact@v4
        with:
          name: acycle-validation-report
          path: |
            validation/matlab/validation-summary.json
            validation/matlab/junit.xml
            validation/matlab/**/*.json
            validation/matlab/**/*.png
          if-no-files-found: warn
          retention-days: 14
